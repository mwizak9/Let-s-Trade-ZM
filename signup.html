<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Signup - Let's Trade ZM</title>
    <style>
        :root {
            --navy: #0a192f;
            --purple: #6b21a8;
            --cream: #fffdfa;
            --black: #0f172a;
            --gold: #f59e0b;
            --border: rgba(255, 255, 255, 0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(rgba(10, 25, 47, 0.9), rgba(10, 25, 47, 0.95)), url('assets/images/image_4.png') no-repeat center center fixed; 
            background-size: cover; 
            color: var(--cream); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px; 
        }
        .form-container { width: 100%; max-width: 480px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); padding: 30px; backdrop-filter: blur(12px); }
        
        .brand-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .logo-badge { width: 42px; height: 42px; background: var(--cream); border: 2px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .logo-badge img { width: 100%; height: 100%; object-fit: cover; }

        .progress-bar { display: flex; justify-content: space-between; margin-bottom: 25px; position: relative; }
        .progress-bar::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 3px; background: var(--border); z-index: 1; transform: translateY(-50%); }
        .step-indicator { width: 34px; height: 34px; background: rgba(255,255,255,0.1); color: #94a3b8; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; z-index: 2; transition: all 0.3s ease; border: 1px solid var(--border); }
        .step-indicator.active { background: var(--gold); color: var(--black); border-color: var(--gold); box-shadow: 0 0 15px rgba(245,158,11,0.4); }
        
        .form-page { display: none; }
        .form-page.active { display: block; }
        
        h2 { margin-bottom: 16px; font-size: 1.35rem; color: var(--cream); }
        
        .option-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .radio-label, .checkbox-label { display: flex; align-items: center; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 14px; cursor: pointer; transition: all 0.2s ease; background: rgba(255,255,255,0.03); }
        .radio-label:hover, .checkbox-label:hover { border-color: var(--gold); background-color: rgba(245,158,11,0.08); }
        input[type="radio"], input[type="checkbox"] { margin-right: 14px; width: 20px; height: 20px; accent-color: var(--gold); }
        
        .catalog-container { max-height: 280px; overflow-y: auto; padding-right: 4px; }
        
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: var(--cream); }
        .input-group input { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 1rem; outline: none; background: rgba(255,255,255,0.05); color: var(--cream); }
        .input-group input:focus { border-color: var(--gold); background: rgba(255,255,255,0.1); }
        
        .payment-box { background: rgba(255,255,255,0.04); border: 1.5px solid var(--border); padding: 18px; border-radius: 14px; margin-bottom: 20px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; color: #94a3b8; }
        .total-row { border-top: 2px dashed var(--border); padding-top: 12px; margin-top: 8px; font-weight: bold; font-size: 1.1rem; color: var(--cream); display: flex; justify-content: space-between; }
        
        .btn-container { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
        .btn { padding: 12px 20px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.2s; flex: 1; text-align: center; }
        .btn-primary { background: var(--gold); color: var(--black); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .btn-primary:hover { background: #d97706; color: white; }
        .btn-secondary { background: transparent; color: #94a3b8; border: 1.5px solid var(--border); }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); color: var(--cream); }
        
        .support-fab { position: fixed; bottom: 25px; right: 25px; width: 56px; height: 56px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.3); cursor: pointer; z-index: 100; font-size: 1.5rem; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="brand-header">
        <div class="logo-badge">
            <img src="assets/images/image_7.png" alt="Logo">
        </div>
        <div>
            <div style="font-weight:800; font-size:1.1rem; color:var(--cream);">Let's Trade ZM</div>
            <div style="font-size:0.75rem; color:#94a3b8;">Customer Registration</div>
        </div>
    </div>

    <div class="progress-bar">
        <div class="step-indicator active">1</div>
        <div class="step-indicator">2</div>
        <div class="step-indicator">3</div>
        <div class="step-indicator">4</div>
    </div>

    <form id="signupForm" onsubmit="handleFormSubmit(event)">
        <!-- Page 1 -->
        <div class="form-page active" id="page-1">
            <h2>Select Account Type</h2>
            <div class="option-group">
                <label class="radio-label">
                    <input type="radio" name="accountType" value="Shared" checked>
                    <div>
                        <strong style="color:var(--cream);">Shared Account</strong>
                        <div style="font-size: 0.8rem; color: #94a3b8;">Access shared profiles or individual slots.</div>
                    </div>
                </label>
                <label class="radio-label">
                    <input type="radio" name="accountType" value="Private">
                    <div>
                        <strong style="color:var(--cream);">Private Account</strong>
                        <div style="font-size: 0.8rem; color: #94a3b8;">Full standalone premium accounts.</div>
                    </div>
                </label>
            </div>
            <div class="btn-container">
                <a href="login.html" class="btn btn-secondary" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">Login</a>
                <button type="button" class="btn btn-primary" onclick="goToPage(2)">NEXT</button>
            </div>
        </div>

        <!-- Page 2 -->
        <div class="form-page" id="page-2">
            <h2>Select Services</h2>
            <div class="catalog-container option-group" id="catalogList"></div>
            <div class="btn-container">
                <button type="button" class="btn btn-secondary" onclick="goToPage(1)">Back</button>
                <button type="button" class="btn btn-primary" onclick="goToPage(3)">NEXT</button>
            </div>
        </div>

        <!-- Page 3 -->
        <div class="form-page" id="page-3">
            <h2>Make Payment</h2>
            <div class="payment-box">
                <div id="orderSummary"></div>
            </div>
            <p style="font-size: 0.8rem; color: #94a3b8; text-align: center; margin-bottom: 10px;">
                Proceed with mobile money transfer based on the total above. Your services are activated once your payment is confirmed.
            </p>
            <div class="btn-container">
                <button type="button" class="btn btn-secondary" onclick="goToPage(2)">Back</button>
                <button type="button" class="btn btn-primary" onclick="goToPage(4)">NEXT</button>
            </div>
        </div>

        <!-- Page 4 -->
        <div class="form-page" id="page-4">
            <h2 id="page4Title">Contact Details</h2>
            <div class="input-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required placeholder="John Doe">
            </div>
            <div class="input-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" required placeholder="e.g. 0970000000">
            </div>
            <div class="input-group">
                <label for="emailAddress">Email Address</label>
                <input type="email" id="emailAddress" required placeholder="john@example.com">
            </div>
            <div class="input-group" id="passwordGroup">
                <label for="password">Create a Password</label>
                <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
            </div>
            <div class="btn-container">
                <button type="button" class="btn btn-secondary" onclick="goToPage(3)">Back</button>
                <button type="submit" class="btn btn-primary" id="submitBtn">SUBMIT &amp; SAVE</button>
            </div>
        </div>
    </form>
</div>

<a href="tel:+260979276543" class="support-fab" title="Call Support">📞</a>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
    let currentPage = 1;
    let catalogData = { Shared: [], Private: [] };
    let selectedItems = [];      // [{id, service, price}]
    let existingCustomer = null; // set when a logged-in customer is adding services

    // The price list is fetched once, in the background. The catalog step waits for it
    // (Apps Script can take a couple of seconds) instead of showing an empty list.
    let catalogPromise = null;
    function loadCatalog() {
        if (!catalogPromise) {
            catalogPromise = api('/api/catalog')
                .then(c => { catalogData = c; })
                .catch(e => { catalogPromise = null; throw e; });
        }
        return catalogPromise;
    }

    async function init() {
        loadCatalog().catch(() => { /* shown when the catalog step opens */ });
        if (getToken('customer')) {
            try {
                existingCustomer = await api('/api/me', { role: 'customer' });
                document.getElementById('fullName').value = existingCustomer.name;
                document.getElementById('phoneNumber').value = existingCustomer.phone;
                document.getElementById('emailAddress').value = existingCustomer.email;
                ['fullName', 'phoneNumber', 'emailAddress'].forEach(id => document.getElementById(id).readOnly = true);
                document.getElementById('passwordGroup').style.display = 'none';
                document.getElementById('password').required = false;
                document.getElementById('page4Title').textContent = 'Confirm Your Details';
            } catch (e) { /* token expired: api() already redirected */ }
        }
    }

    function goToPage(pageNumber) {
        if (pageNumber === 2 && currentPage === 1) generateCatalog();
        if (pageNumber === 3) {
            const total = generateSummary();
            if (total === 0) {
                alert("Please select at least one item from the catalog.");
                return;
            }
        }
        document.getElementById(`page-${currentPage}`).classList.remove('active');
        document.getElementById(`page-${pageNumber}`).classList.add('active');
        currentPage = pageNumber;
        updateProgressIndicators();
    }

    function updateProgressIndicators() {
        document.querySelectorAll('.step-indicator').forEach((ind, idx) => {
            ind.classList.toggle('active', idx < currentPage);
        });
    }

    async function generateCatalog() {
        const accountType = document.querySelector('input[name="accountType"]:checked').value;
        const container = document.getElementById('catalogList');
        container.innerHTML = '<p style="color:#94a3b8; text-align:center; padding:10px;">Loading services...</p>';
        try {
            await loadCatalog();
        } catch (e) {
            container.innerHTML = '<p style="color:#fca5a5; text-align:center; padding:10px;">' + esc(e.message) +
                '</p><button type="button" class="btn btn-secondary" style="width:100%;" onclick="generateCatalog()">Try again</button>';
            return;
        }
        const items = catalogData[accountType] || [];
        container.innerHTML = '';

        if (items.length === 0) {
            container.innerHTML = '<p style="color:#94a3b8; text-align:center; padding:10px;">No services available in this category.</p>';
            return;
        }

        items.forEach(item => {
            const label = document.createElement('label');
            label.className = 'checkbox-label';
            label.innerHTML = `
                <input type="checkbox" name="services" value="${item.id}" data-price="${item.price}" data-name="${esc(item.service)}">
                <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                    <span style="font-size:0.9rem; font-weight:500; color:var(--cream);">${esc(item.service)}</span>
                    <strong style="color:var(--gold);">K${item.price}</strong>
                </div>
            `;
            container.appendChild(label);
        });
    }

    function generateSummary() {
        const checked = document.querySelectorAll('input[name="services"]:checked');
        const container = document.getElementById('orderSummary');
        container.innerHTML = '';
        selectedItems = [];
        let total = 0;

        checked.forEach(box => {
            const name = box.getAttribute('data-name');
            const price = parseFloat(box.getAttribute('data-price'));
            total += price;
            selectedItems.push({ id: parseInt(box.value, 10), service: name, price });

            const row = document.createElement('div');
            row.className = 'summary-item';
            row.innerHTML = `<span>${esc(name)}</span> <span>K${price}</span>`;
            container.appendChild(row);
        });

        const totalRow = document.createElement('div');
        totalRow.className = 'total-row';
        totalRow.innerHTML = `<span>Total Due:</span> <span style="color:var(--gold);">K${total}</span>`;
        container.appendChild(totalRow);
        return total;
    }

    async function handleFormSubmit(event) {
        event.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        const ids = selectedItems.map(i => i.id);

        try {
            if (existingCustomer) {
                await api('/api/me/subscriptions', { method: 'POST', role: 'customer', body: { items: ids } });
            } else {
                const res = await api('/api/auth/signup', {
                    method: 'POST',
                    body: {
                        name: document.getElementById('fullName').value.trim(),
                        phone: document.getElementById('phoneNumber').value.trim(),
                        email: document.getElementById('emailAddress').value.trim(),
                        password: document.getElementById('password').value,
                        items: ids
                    }
                });
                setToken('customer', res.token);
            }
            alert('Order received! Your services will be activated once your payment is confirmed. Redirecting to your dashboard.');
            window.location.href = 'customer_dashboard.html';
        } catch (e) {
            alert(e.message);
            btn.disabled = false;
        }
    }

    init();
</script>
</body>
</html>
